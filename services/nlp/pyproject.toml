[tool.poetry]
name = "neoncheck-nlp"
version = "0.1.0"
description = "FastAPI microservice for NeonCheck AI sentiment and SEO recommendations"
authors = ["NeonCheck AI Team <dev@neonbirr.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.1"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
httpx = "^0.27.0"
spacy = "^3.7.4"
spacy-transformers = "^1.3.4"
openai = "^1.23.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
